<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator">
      <div class="output">
        <input type="text" class="text" placeholder="0" value="" />
      </div>
      <div>
        <input type="button" value="Ac" class="operater Ac" />
        <input type="button" value="DEL" class="operater DEL" />
        <input type="button" value="%" class="operater val" />
        <input type="button" value="/" class="operater val" />
      </div>
      <div>
        <input type="button" value="7" class="val" />
        <input type="button" value="8" class="val" />
        <input type="button" value="8" class="val" />
        <input type="button" value="*" class="operater val" />
      </div>
      <div>
        <input type="button" value="4" class="val" />
        <input type="button" value="5" class="val" />
        <input type="button" value="6" class="val" />
        <input type="button" value="-" class="operater val" />
      </div>
      <div>
        <input type="button" value="1" class="val" />
        <input type="button" value="2" class="val" />
        <input type="button" value="3" class="val" />
        <input type="button" value="+" class="operater val" />
      </div>
      <div>
        <input type="button" value="." class="operater val" />
        <input type="button" value="0" class="val" />
        <input type="button" value="=" class="equal operater" />
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
